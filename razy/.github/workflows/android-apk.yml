name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      RAZY_SERVER_URL: ${{ vars.RAZY_SERVER_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require deployed HTTPS website URL
        run: |
          node -e 'try { const url = new URL(process.env.RAZY_SERVER_URL || ""); if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash) process.exit(1); } catch { console.error("Set the GitHub Actions variable RAZY_SERVER_URL to the deployed HTTPS RAZY website origin, without credentials or a path."); process.exit(1); }'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Sync deployed site into Capacitor Android project
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: razy-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14